<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- gota d'água (higienização/limpeza) -->
  <path
    d="M32 12
       C32 12 20 28 20 38
       a12 12 0 0 0 24 0
       C44 28 32 12 32 12 Z"
    fill="url(#drop)"
  />

  <!-- brilho dentro da gota -->
  <path
    d="M25 37
       a7 7 0 0 0 6 7"
    stroke="#ffffff"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
    opacity="0.75"
  />

  <!-- sparkle de "limpo" -->
  <path
    d="M48 14 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z"
    fill="#7dd3fc"
    opacity="0.9"
  />
</svg>
